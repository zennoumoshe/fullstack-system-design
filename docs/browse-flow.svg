<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 2058" width="1240" height="2058" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m-ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="m-bytes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="m-next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="1240" height="2058" fill="#ffffff"/><text x="620.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">Browse — end-to-end flow</text><line x1="120" y1="120" x2="120" y2="1886" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="20.0" y="60" width="200" height="60" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="120" y="86" font-size="15" font-weight="700" text-anchor="middle" fill="#1e40af">Client (browser)</text><text x="120" y="105" font-size="11.5" text-anchor="middle" fill="#1e40af">React</text><line x1="380" y1="120" x2="380" y2="1886" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="295.0" y="60" width="170" height="60" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="380" y="86" font-size="15" font-weight="700" text-anchor="middle" fill="#166534">API</text><text x="380" y="105" font-size="11.5" text-anchor="middle" fill="#166534">FastAPI (Python)</text><line x1="620" y1="120" x2="620" y2="1886" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="535.0" y="60" width="170" height="60" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/><text x="620" y="86" font-size="15" font-weight="700" text-anchor="middle" fill="#92400e">PostgreSQL</text><text x="620" y="105" font-size="11.5" text-anchor="middle" fill="#92400e">source of truth</text><line x1="860" y1="120" x2="860" y2="1886" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="775.0" y="60" width="170" height="60" rx="8" fill="#e0f2fe" stroke="#075985" stroke-width="1.5"/><text x="860" y="86" font-size="15" font-weight="700" text-anchor="middle" fill="#075985">OpenSearch</text><text x="860" y="105" font-size="11.5" text-anchor="middle" fill="#075985">search index</text><line x1="1100" y1="120" x2="1100" y2="1886" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="1015.0" y="60" width="170" height="60" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="1100" y="86" font-size="15" font-weight="700" text-anchor="middle" fill="#9a3412">Object storage</text><text x="1100" y="105" font-size="11.5" text-anchor="middle" fill="#9a3412">S3 / GCS / MinIO</text><rect x="0" y="138" width="1240" height="26" fill="#f1f5f9"/><text x="16" y="156" font-size="14" text-anchor="start" font-weight="700" fill="#0f172a" >1. Search and filters</text><text x="205" y="156" font-size="12" text-anchor="start" font-weight="normal" fill="#64748b" >  — typing text, checking/unchecking a filter, sorting, scrolling: always this request</text><text x="250.0" y="190" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2563eb" >GET /search</text><text x="250.0" y="205" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >?q=north&amp;project=Alpha&amp;type=radar&amp;sort=date</text><line x1="126" y1="214" x2="374" y2="214" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-ctrl)"/><rect x="270.0" y="230" width="220" height="40" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="380" y="244" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">Builds the OpenSearch query</text><text x="380" y="259" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">(+ access filter if needed)</text><text x="620.0" y="300" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2563eb" >ONE request</text><text x="620.0" y="315" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >query: text + filters</text><text x="620.0" y="330" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >aggs: facet counts + suggested keys</text><text x="620.0" y="345" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >sort + search_after (cursor)</text><line x1="386" y1="354" x2="854" y2="354" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-ctrl)"/><text x="620.0" y="384" font-size="12.5" text-anchor="middle" font-weight="600" fill="#64748b" >← results (list fields, preview_key)</text><text x="620.0" y="399" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >+ total + counts + sort values</text><line x1="854" y1="408" x2="386" y2="408" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-ret)"/><rect x="265.0" y="424" width="230" height="40" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="380" y="438" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">Signs one GET URL per preview</text><text x="380" y="453" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">(local computation, rounded expiry)</text><text x="250.0" y="494" font-size="12.5" text-anchor="middle" font-weight="600" fill="#64748b" >← results[] + facets{} + total + next_cursor</text><text x="250.0" y="509" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >{id, name, type, size, project, enrichment_status, preview_url}</text><line x1="374" y1="518" x2="126" y2="518" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-ret)"/><text x="610.0" y="548" font-size="12.5" text-anchor="middle" font-weight="600" fill="#c2410c" >GET previews/{uuid}.webp (signed URL)</text><text x="610.0" y="563" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >automatic via &lt;img loading=lazy&gt;, no click</text><line x1="128" y1="572" x2="1092" y2="572" stroke="#ea580c" stroke-width="5" marker-end="url(#m-bytes)"/><text x="610.0" y="602" font-size="12.5" text-anchor="middle" font-weight="600" fill="#64748b" >← image</text><line x1="1094" y1="611" x2="126" y2="611" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-ret)"/><rect x="7.0" y="627" width="226" height="40" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="120" y="641" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">Scrolling → next page:</text><text x="120" y="656" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">GET /search?…&amp;cursor=next_cursor</text><rect x="0" y="685" width="1240" height="26" fill="#f1f5f9"/><text x="16" y="703" font-size="14" text-anchor="start" font-weight="700" fill="#0f172a" >2. Values of a dynamic key</text><text x="250" y="703" font-size="12" text-anchor="start" font-weight="normal" fill="#64748b" >  — the only new request; no result changes</text><rect x="20.0" y="723" width="200" height="40" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="120" y="737" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">Click on the suggested key</text><text x="120" y="752" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">“sensor_id (80)”</text><text x="250.0" y="793" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2563eb" >GET /facets/values</text><text x="250.0" y="808" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >?key=sensor_id + current filters</text><line x1="126" y1="817" x2="374" y2="817" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-ctrl)"/><text x="620.0" y="847" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2563eb" >terms aggregation on meta.sensor_id</text><text x="620.0" y="862" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >with the current filters (top 20)</text><line x1="386" y1="871" x2="854" y2="871" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-ctrl)"/><text x="620.0" y="901" font-size="12.5" text-anchor="middle" font-weight="600" fill="#64748b" >← values + counts</text><line x1="854" y1="910" x2="386" y2="910" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-ret)"/><text x="250.0" y="940" font-size="12.5" text-anchor="middle" font-weight="600" fill="#64748b" >← S-12 (45), S-07 (35)…</text><line x1="374" y1="949" x2="126" y2="949" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-ret)"/><rect x="7.0" y="965" width="226" height="70" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="120" y="979" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">Picking S-12 → back to step 1:</text><text x="120" y="994" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">GET /search?…&amp;meta.sensor_id=S-12</text><text x="120" y="1009" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">Another filter changes →</text><text x="120" y="1024" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">the values are requested again</text><rect x="0" y="1053" width="1240" height="26" fill="#f1f5f9"/><text x="16" y="1071" font-size="14" text-anchor="start" font-weight="700" fill="#0f172a" >3. Detail panel</text><text x="151" y="1071" font-size="12" text-anchor="start" font-weight="normal" fill="#64748b" >  — click on a result</text><text x="250.0" y="1105" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2563eb" >GET /files/42</text><line x1="126" y1="1114" x2="374" y2="1114" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-ctrl)"/><text x="500.0" y="1144" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2563eb" >SELECT file + its batch</text><text x="500.0" y="1159" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >by id</text><line x1="386" y1="1168" x2="614" y2="1168" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-ctrl)"/><text x="500.0" y="1198" font-size="12.5" text-anchor="middle" font-weight="600" fill="#64748b" >← the full row</text><text x="500.0" y="1213" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >identity, metadata, provenance</text><line x1="614" y1="1222" x2="386" y2="1222" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-ret)"/><rect x="280.0" y="1238" width="200" height="40" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="380" y="1252" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">Signs the preview URL</text><text x="380" y="1267" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">(local computation)</text><text x="250.0" y="1308" font-size="12.5" text-anchor="middle" font-weight="600" fill="#64748b" >← detail JSON + preview_url</text><line x1="374" y1="1317" x2="126" y2="1317" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-ret)"/><text x="610.0" y="1347" font-size="12.5" text-anchor="middle" font-weight="600" fill="#c2410c" >GET previews/{uuid}.webp (signed URL)</text><text x="610.0" y="1362" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >automatic via &lt;img&gt;</text><line x1="128" y1="1371" x2="1092" y2="1371" stroke="#ea580c" stroke-width="5" marker-end="url(#m-bytes)"/><text x="610.0" y="1401" font-size="12.5" text-anchor="middle" font-weight="600" fill="#64748b" >← image</text><line x1="1094" y1="1410" x2="126" y2="1410" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-ret)"/><rect x="20.0" y="1426" width="200" height="55" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="120" y="1440" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">“View batch” →</text><text x="120" y="1455" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">GET /search?batch_id=7</text><text x="120" y="1470" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">(back to step 1)</text><rect x="0" y="1499" width="1240" height="26" fill="#f1f5f9"/><text x="16" y="1517" font-size="14" text-anchor="start" font-weight="700" fill="#0f172a" >4. Download</text><text x="115" y="1517" font-size="12" text-anchor="start" font-weight="normal" fill="#64748b" >  — click on “Download” in the detail panel</text><text x="250.0" y="1551" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2563eb" >GET /files/42/download</text><line x1="126" y1="1560" x2="374" y2="1560" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-ctrl)"/><text x="500.0" y="1590" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2563eb" >SELECT storage_key, original name</text><line x1="386" y1="1599" x2="614" y2="1599" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-ctrl)"/><text x="500.0" y="1629" font-size="12.5" text-anchor="middle" font-weight="600" fill="#64748b" >← files/{uuid}, scan_001.ref</text><line x1="614" y1="1638" x2="386" y2="1638" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-ret)"/><rect x="265.0" y="1654" width="230" height="40" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="380" y="1668" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">Signs a GET URL (~1 h)</text><text x="380" y="1683" font-size="11" text-anchor="middle" font-weight="normal" fill="#78350f" font-style="italic">Content-Disposition: original name</text><text x="250.0" y="1724" font-size="12.5" text-anchor="middle" font-weight="600" fill="#64748b" >← 302 Redirect</text><text x="250.0" y="1739" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >Location: signed URL</text><line x1="374" y1="1748" x2="126" y2="1748" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-ret)"/><text x="610.0" y="1778" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2563eb" >GET files/{uuid} (signed URL)</text><text x="610.0" y="1793" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >redirect followed automatically</text><line x1="126" y1="1802" x2="1094" y2="1802" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-ctrl)"/><text x="610.0" y="1832" font-size="12.5" text-anchor="middle" font-weight="600" fill="#c2410c" >← the file bytes</text><text x="610.0" y="1847" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" >native download manager: progress, pause, resume</text><line x1="1092" y1="1856" x2="128" y2="1856" stroke="#ea580c" stroke-width="5" marker-end="url(#m-bytes)"/><rect x="0" y="1884" width="1240" height="26" fill="#f1f5f9"/><text x="16" y="1902" font-size="14" text-anchor="start" font-weight="700" fill="#0f172a" >What browse reads</text><rect x="32.5" y="1928" width="175" height="70" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.2"/><text x="120" y="1950" font-size="12" text-anchor="middle" font-weight="normal" fill="#1e40af" >Nothing persistent</text><rect x="292.5" y="1928" width="175" height="70" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/><text x="380" y="1950" font-size="12" text-anchor="middle" font-weight="normal" fill="#166534" >Nothing</text><text x="380" y="1966" font-size="12" text-anchor="middle" font-weight="normal" fill="#166534" >(stateless)</text><rect x="532.5" y="1928" width="175" height="70" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/><text x="620" y="1950" font-size="12" text-anchor="middle" font-weight="normal" fill="#92400e" >Read only</text><text x="620" y="1966" font-size="12" text-anchor="middle" font-weight="normal" fill="#92400e" >(detail, download)</text><rect x="772.5" y="1928" width="175" height="70" rx="8" fill="#e0f2fe" stroke="#075985" stroke-width="1.2"/><text x="860" y="1950" font-size="12" text-anchor="middle" font-weight="normal" fill="#075985" >Read only</text><text x="860" y="1966" font-size="12" text-anchor="middle" font-weight="normal" fill="#075985" >(never written by browse)</text><rect x="1012.5" y="1928" width="175" height="70" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.2"/><text x="1100" y="1950" font-size="12" text-anchor="middle" font-weight="normal" fill="#9a3412" >previews/: display</text><text x="1100" y="1966" font-size="12" text-anchor="middle" font-weight="normal" fill="#9a3412" >files/: download</text><line x1="20" y1="2028" x2="70" y2="2028" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-ctrl)"/><text x="82" y="2032" font-size="12" text-anchor="start" font-weight="normal" fill="#334155" >Control request (small JSON)</text><line x1="340" y1="2028" x2="390" y2="2028" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-ret)"/><text x="402" y="2032" font-size="12" text-anchor="start" font-weight="normal" fill="#334155" >Response</text><line x1="660" y1="2028" x2="710" y2="2028" stroke="#ea580c" stroke-width="5" marker-end="url(#m-bytes)"/><text x="722" y="2032" font-size="12" text-anchor="start" font-weight="normal" fill="#334155" >File bytes</text></svg>