<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 860" width="1420" height="860" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="s-b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563eb"/></marker><marker id="s-o" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect width="1420" height="860" fill="#ffffff"/><text x="710.0" y="30" font-size="19" font-weight="700" text-anchor="middle" fill="#0f172a">Architecture overview: who talks to whom, how, and with what</text><path d="M710,158 L710,326" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-b)" marker-start="url(#s-b)"/><rect x="717" y="210" width="141.1" height="15" fill="#ffffff" opacity="0.93"/><text x="722" y="222" font-size="11.5" text-anchor="start" font-weight="700" fill="#2563eb">HTTPS · REST (JSON)</text><rect x="717" y="225" width="249.4" height="15" fill="#ffffff" opacity="0.93"/><text x="722" y="237" font-size="11.5" text-anchor="start" font-weight="normal" fill="#334155">→ metadata, searches, signing requests</text><rect x="717" y="240" width="287.2" height="15" fill="#ffffff" opacity="0.93"/><text x="722" y="252" font-size="11.5" text-anchor="start" font-weight="normal" fill="#334155">← uploadId, presigned URLs, results, details</text><path d="M864,112 L1245,112 L1245,326" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#m-o)" marker-start="url(#s-o)"/><rect x="932.7" y="138" width="244.60000000000002" height="15" fill="#ffffff" opacity="0.93"/><text x="1055" y="150" font-size="11.5" text-anchor="middle" font-weight="700" fill="#ea580c">HTTPS · presigned URLs (PUT / GET)</text><rect x="949.2" y="153" width="211.6" height="15" fill="#ffffff" opacity="0.93"/><text x="1055" y="165" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#334155">→ file parts (~100 MB, + CRC32C)</text><rect x="917.7" y="168" width="274.59999999999997" height="15" fill="#ffffff" opacity="0.93"/><text x="1055" y="180" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#334155">← ETag per part, previews, downloaded file</text><path d="M566,372 L304,372" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-b)" marker-start="url(#s-b)"/><rect x="364.45" y="306" width="141.1" height="15" fill="#ffffff" opacity="0.93"/><text x="435" y="318" font-size="11.5" text-anchor="middle" font-weight="700" fill="#2563eb">HTTPS · REST (JSON)</text><rect x="385.9" y="321" width="98.2" height="15" fill="#ffffff" opacity="0.93"/><text x="435" y="333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#334155">→ query + aggs</text><rect x="373.3" y="336" width="123.39999999999999" height="15" fill="#ffffff" opacity="0.93"/><text x="435" y="348" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#334155">← results + counts</text><path d="M854,372 L1106,372" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-b)" marker-start="url(#s-b)"/><rect x="926.7" y="306" width="106.60000000000001" height="15" fill="#ffffff" opacity="0.93"/><text x="980" y="318" font-size="11.5" text-anchor="middle" font-weight="700" fill="#2563eb">HTTPS · S3 API</text><rect x="874.2" y="321" width="211.6" height="15" fill="#ffffff" opacity="0.93"/><text x="980" y="333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#334155">→ create / list parts / complete</text><rect x="905.7" y="336" width="148.6" height="15" fill="#ffffff" opacity="0.93"/><text x="980" y="348" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#334155">← uploadId, parts, CRC</text><path d="M650,418 L510,606" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-b)" marker-start="url(#s-b)"/><rect x="404.29999999999995" y="488" width="168.70000000000002" height="15" fill="#ffffff" opacity="0.93"/><text x="568" y="500" font-size="11.5" text-anchor="end" font-weight="700" fill="#2563eb">SQL (Postgres protocol)</text><rect x="399.20000000000005" y="503" width="173.79999999999998" height="15" fill="#ffffff" opacity="0.93"/><text x="568" y="515" font-size="11.5" text-anchor="end" font-weight="normal" fill="#334155">→ INSERT / UPDATE / SELECT</text><rect x="525.2" y="518" width="47.8" height="15" fill="#ffffff" opacity="0.93"/><text x="568" y="530" font-size="11.5" text-anchor="end" font-weight="normal" fill="#334155">← rows</text><path d="M780,418 L860,606" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-b)" marker-start="url(#s-b)"/><rect x="825" y="488" width="154.9" height="15" fill="#ffffff" opacity="0.93"/><text x="830" y="500" font-size="11.5" text-anchor="start" font-weight="700" fill="#2563eb">RESP (Redis protocol)</text><rect x="825" y="503" width="123.39999999999999" height="15" fill="#ffffff" opacity="0.93"/><text x="830" y="515" font-size="11.5" text-anchor="start" font-weight="normal" fill="#334155">→ XADD { file_id }</text><path d="M974,652 L1116,652" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-b)" marker-start="url(#s-b)"/><rect x="1026.2" y="614" width="37.6" height="15" fill="#ffffff" opacity="0.93"/><text x="1045" y="626" font-size="11.5" text-anchor="middle" font-weight="700" fill="#2563eb">RESP</text><rect x="1008.5" y="629" width="73.0" height="15" fill="#ffffff" opacity="0.93"/><text x="1045" y="641" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#334155">XREADGROUP</text><rect x="1017.95" y="644" width="54.1" height="15" fill="#ffffff" opacity="0.93"/><text x="1045" y="656" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#334155">XACKDEL</text><path d="M1245,606 L1245,418" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-b)" marker-start="url(#s-b)"/><rect x="1252" y="488" width="106.60000000000001" height="15" fill="#ffffff" opacity="0.93"/><text x="1257" y="500" font-size="11.5" text-anchor="start" font-weight="700" fill="#2563eb">HTTPS · S3 API</text><rect x="1252" y="503" width="173.79999999999998" height="15" fill="#ffffff" opacity="0.93"/><text x="1257" y="515" font-size="11.5" text-anchor="start" font-weight="normal" fill="#334155">→ range GET, PUT previews/</text><rect x="1252" y="518" width="136.0" height="15" fill="#ffffff" opacity="0.93"/><text x="1257" y="530" font-size="11.5" text-anchor="start" font-weight="normal" fill="#334155">← headers (KB to MB)</text><path d="M1180,698 L1180,750 L485,750 L485,698" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-b)" marker-start="url(#s-b)"/><rect x="611.1" y="734" width="437.8" height="15" fill="#ffffff" opacity="0.93"/><text x="830" y="746" font-size="11.5" text-anchor="middle" font-weight="700" fill="#2563eb">SQL → UPDATE tech_metadata, preview_key, status  ·  ← file row</text><path d="M1330,698 L1330,800 L175,800 L175,418" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-b)" marker-start="url(#s-b)"/><rect x="582.5" y="784" width="355.0" height="15" fill="#ffffff" opacity="0.93"/><text x="760" y="796" font-size="11.5" text-anchor="middle" font-weight="700" fill="#2563eb">HTTPS · REST (JSON) → file document (id = file_id)</text><rect x="560" y="70" width="300" height="84" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="710.0" y="96" font-size="16" text-anchor="middle" font-weight="700" fill="#1e40af">Client (browser)</text><text x="710.0" y="116" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1e40af">React + TypeScript + Uppy</text><text x="710.0" y="138" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" font-style="italic">holds: nothing persistent</text><rect x="50" y="330" width="250" height="84" rx="10" fill="#e0f2fe" stroke="#075985" stroke-width="1.6"/><text x="175.0" y="356" font-size="16" text-anchor="middle" font-weight="700" fill="#075985">OpenSearch</text><text x="175.0" y="376" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#075985">search index</text><text x="175.0" y="398" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" font-style="italic">holds: a copy of the metadata</text><rect x="570" y="330" width="280" height="84" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="710.0" y="356" font-size="16" text-anchor="middle" font-weight="700" fill="#166534">API</text><text x="710.0" y="376" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#166534">FastAPI (Python) + periodic jobs</text><text x="710.0" y="398" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" font-style="italic">holds: stateless</text><rect x="1110" y="330" width="270" height="84" rx="10" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="1245.0" y="356" font-size="16" text-anchor="middle" font-weight="700" fill="#9a3412">Object storage</text><text x="1245.0" y="376" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#9a3412">S3 / GCS / MinIO</text><text x="1245.0" y="398" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" font-style="italic">holds: the bytes: files/ + previews/</text><rect x="360" y="610" width="250" height="84" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="1.6"/><text x="485.0" y="636" font-size="16" text-anchor="middle" font-weight="700" fill="#92400e">PostgreSQL</text><text x="485.0" y="656" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#92400e">source of truth</text><text x="485.0" y="678" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" font-style="italic">holds: catalog, statuses, metadata</text><rect x="760" y="610" width="210" height="84" rx="10" fill="#f3e8ff" stroke="#6b21a8" stroke-width="1.6"/><text x="865.0" y="636" font-size="16" text-anchor="middle" font-weight="700" fill="#6b21a8">Redis Streams</text><text x="865.0" y="656" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#6b21a8">task queue</text><text x="865.0" y="678" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" font-style="italic">holds: pending tasks</text><rect x="1120" y="610" width="250" height="84" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="1245.0" y="636" font-size="16" text-anchor="middle" font-weight="700" fill="#334155">Workers</text><text x="1245.0" y="656" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#334155">Python + ExifTool, Pillow, ffmpeg…</text><text x="1245.0" y="678" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569" font-style="italic">holds: stateless</text><line x1="30" y1="838" x2="80" y2="838" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-b)"/><text x="92" y="842" font-size="12" text-anchor="start" font-weight="normal" fill="#334155">Control: small requests (→ what is sent, ← what comes back)</text><line x1="560" y1="838" x2="610" y2="838" stroke="#ea580c" stroke-width="4" marker-end="url(#m-o)"/><text x="622" y="842" font-size="12" text-anchor="start" font-weight="normal" fill="#334155">File bytes: straight between the client and storage, never through the API</text></svg>